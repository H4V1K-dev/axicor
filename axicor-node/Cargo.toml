[package]
name = "axicor-node"
default-run = "axicor-node"
description = "Axicor SNN engine — BSP-lockstep orchestrator, UDP fast-path server, Night Phase daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
categories = ["science::neuroscience", "science::robotics", "network-programming", "simulation", "concurrency"]
keywords = ["snn", "neuromorphic", "bsp", "realtime", "robotics"]
exclude = [
    "tests/fixtures/*",
    "benches/*",
    "*.state",
    "*.axons",
    "*.axic",
    "*.gxi",
    "*.gxo",
    "Axicor-Models/",
    "*-Models/",
    ".Sandbox/",
    "*.log",
    "checkpoints/",
    "*.ckpt"
]

[dependencies]
axicor-core = { workspace = true }
axicor-compute = { version = "0.1.0", path = "../axicor-compute" }
anyhow = "=1.0.102"
tokio = { version = "=1.50.0", features = ["full"] }
bincode = "=1.3.3"
serde = { version = "=1.0.228", features = ["derive"] }
clap = { version = "=4.5.60", features = ["derive"] }
toml = { workspace = true }
axum = { version = "=0.7.9", features = ["ws"] }
crossbeam = "=0.8.4"
bytemuck = { version = "=1.25.0", features = ["derive"] }
memmap2 = "=0.9.10"
libc = "=0.2.182"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }
tracing-appender = "=0.2.5"

[dev-dependencies]
tempfile = "=3.26.0"

[features]
mock-gpu = ["axicor-compute/mock-gpu"]
amd = ["axicor-core/amd", "axicor-compute/amd"]

[package.metadata.docs.rs]
all-features = false
features = ["mock-gpu"]


[package]
name = "axicor-baker"
description = "Axicor SNN engine — offline topology compiler. TOML brain DNA → binary .state/.axons memory dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "science::neuroscience", "compilers", "simulation", "science::robotics"]
keywords = ["snn", "neuromorphic", "topology", "connectome", "brain"]
exclude = [
    "tests/fixtures/*",
    "benches/*",
    "*.state",
    "*.axons",
    "*.axic",
    "*.gxi",
    "*.gxo",
    "Axicor-Models/",
    "*-Models/",
    ".Sandbox/",
    "*.log",
    "checkpoints/",
    "*.ckpt"
]

[[bin]]
name = "axicor-baker"
path = "src/main.rs"

[[bin]]
name = "axicor-baker-daemon"
path = "src/bin/daemon.rs"

[dependencies]
axicor-core = { version = "0.1.0", path = "../axicor-core" }
toml = { workspace = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
anyhow = "=1.0.102"
clap = { version = "=4.5.60", features = ["derive"] }
wyhash = "=0.5.0"
glam = "=0.24.2"
rayon = "=1.11.0"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
bytemuck = "=1.25.0"
memmap2 = "=0.9.10"
axicor-compute = { version = "0.1.0", path = "../axicor-compute" }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }
tracing-appender = "=0.2.5"

[features]
mock-gpu = ["axicor-compute/mock-gpu"]
amd = ["axicor-core/amd", "axicor-compute/amd"]

[package.metadata.docs.rs]
all-features = false
features = ["mock-gpu"]

